# [GIẢI PHÁP 1 - TỰ ĐỘNG HÓA TIẾN HÓA]:
# Robot định kỳ kiểm tra các công nghệ mới và tự động cập nhật
version: 2
updates:
  # Tự động canh chừng các bản cập nhật của GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Tự động canh chừng các bản vá bảo mật của chiếc hộp Docker Python
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
