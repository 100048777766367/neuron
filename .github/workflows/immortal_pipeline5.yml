name: He Thong No-ron Bat Tu (3 trong 1)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  train-neuron:
    runs-on: ubuntu-latest
    
    # [GIẢI PHÁP 3 - DOCKER]: Toàn bộ lệnh sẽ chạy bên trong chiếc hộp Python này
    # Cách ly 100% khỏi môi trường máy chủ bên ngoài của GitHub
    container:
      image: python:3.10-slim

    steps:
      # [GIẢI PHÁP 2 - NATIVE SHELL]: Dùng lệnh Linux và Git gốc
      # Hoàn toàn không dùng Action trung gian của Node.js, miễn nhiễm với việc đổi Node
      - name: Cai dat Git va keo ma nguon goc
        run: |
          apt-get update && apt-get install -y git
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Huan luyen mang No-ron
        run: |
          python xor_network.py
