name: AI Tự Động Trả Lời Issue

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  tra-loi-nguoi-dung:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn và túi ký ức phân tán
        uses: actions/checkout@v7

      - name: Cài đặt Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Chạy suy luận từ Bầy Nơ-ron
        id: run_ai
        run: |
          INPUT="${{ github.event.issue.title }}"
          echo "Câu hỏi nhận được: $INPUT"
          
          OUTPUT=$(python predict.py "$INPUT")
          
          # Lưu an toàn vào biến đầu ra
          echo "KET_QUA<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Bot tự động viết bình luận phản hồi
        uses: actions/github-script@v9
        env:
          # TRUYỀN QUA BIẾN MÔI TRƯỜNG ĐỂ CHỐNG VỠ CÚ PHÁP XUỐNG DÒNG
          AI_OUTPUT: ${{ steps.run_ai.outputs.KET_QUA }}
        with:
          script: |
            const output = process.env.AI_OUTPUT;
            const commentBody = `### 🤖 Phản hồi tự động từ Bầy Nơ-ron (Swarm-Bot)\n\nChào bạn! Mạng lưới nơ-ron phân tán đã nạp các túi ký ức từ \`synapses/\` và đưa ra phán quyết:\n\n\`\`\`text\n${output}\n\`\`\`\n\n*(Hệ thống vận hành bằng kiến trúc nơ-ron phân tán cực hạn, tự động hóa 100% trên GitHub Actions)*`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
