name: Vòng Đời Bầy Nơ-ron Phân Tán

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ngửi tín hiệu từ Mắt qua môi trường
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -f "https://raw.githubusercontent.com/$OWNER/retina/main/synapse_forward.json" -o synapse_forward.json || echo "Không có xung mới."

      # CHẠY BẦY NƠ-RON PHÂN TÁN
      - name: Vận hành Bầy Nơ-ron
        run: python swarm_engine.py

      # LƯU KÝ ỨC CỦA TOÀN BỘ CÁC NƠ-RON ĐỘC LẬP
      - name: Lưu vết tích tiến hóa phân tán
        run: |
          git config --global user.name "Swarm-Bot"
          git config --global user.email "bot@swarm.node"
          git add synapses/ synapse_backward.json 2>/dev/null || true
          git commit -m "🐝 [Bầy Đàn] Cập nhật túi ký ức phân tán [skip ci]" || echo "Không có thay đổi"
          git push
