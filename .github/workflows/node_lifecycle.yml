name: Vòng Đời Bầy Nơ-ron Phân Tán (HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm chạy thủ công
  # Lập lịch tự thức dậy kiểm tra môi trường mỗi 6 tiếng một lần (Nhịp thở tự nhiên)
  schedule:
    - cron: '0 */6 * * *'

# CẤP QUYỀN GHI ĐỂ BẦY NƠ-RON TỰ CẬP NHẬT TÚI KÝ ỨC VÀO GIT
permissions:
  contents: write

jobs:
  run-swarm-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn nút mạng
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # CẢM ỨNG MÔI TRƯỜNG (STIGMERGY): 
      # Dùng ${{ github.repository_owner }} để người khác FORK về tự động tìm đúng Mắt của họ
      - name: Ngửi tín hiệu từ nút Mắt tương ứng
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "📡 Đang dò tìm tín hiệu thị giác từ $OWNER/retina..."
          curl -s -f "https://raw.githubusercontent.com/$OWNER/retina/main/synapse_forward.json" -o synapse_forward.json || echo "🍃 Môi trường tĩnh, chưa có xung thị giác mới."

      # VẬN HÀNH BẦY NƠ-RON TỰ TRỊ BẤT ĐỒNG BỘ
      - name: Vận hành Động cơ Bầy đàn (Stigmergy Engine)
        run: |
          python stigmergy_engine.py

      # LƯU VẾT TÍCH KÝ ỨC PHÂN TÁN VÀ VỆT ĐẠO HÀM VÀO GIT
      - name: Lưu vết tích tiến hóa phân tán (HA Sync)
        run: |
          git config --global user.name "Swarm-Node-Bot"
          git config --global user.email "bot@swarm.node"
          # Lưu toàn bộ các tệp ký ức lẻ trong synapses/ và tệp đạo hàm gửi Mắt
          git add synapses/ synapse_backward.json 2>/dev/null || true
          git commit -m "🐝 [Tiến Hóa Bầy Đàn] Cập nhật túi ký ức phân tán [skip ci]" || echo "Không có biến đổi mới."
          git push
