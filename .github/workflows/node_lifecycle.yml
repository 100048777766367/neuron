name: Vòng Đời Bầy Nơ-ron Phân Tán (HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  run-swarm-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn nút mạng
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # NẤC 1: XÚC TU VƯƠN VÒI TÌM PHẢ HỆ (GIA ĐÌNH)
      - name: Xúc tu vươn vòi tìm Mắt phả hệ
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python receptors/cascade_receptor.py

      # NẤC 3: ANTEN BẮT SÓNG SỢI NẤM TOÀN CẦU (NẾU GIA ĐÌNH CHƯA CÓ)
      - name: Anten bắt sóng mạng sợi nấm toàn cầu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python receptors/mesh_receptor.py

      # NẤC 2: MÀNG MIỄN DỊCH LỌC SẠCH ĐỘC TỐ (KHÓA & CHÌA)
      - name: Màng miễn dịch kiểm định hợp đồng
        run: python receptors/contract_receptor.py

      # NHÂN TẾ BÀO: BẦY NƠ-RON VẬN HÀNH
      - name: Vận hành Động cơ Bầy đàn
        run: python stigmergy_engine.py

      # LƯU VẾT TÍCH TIẾN HÓA VÀO GIT
      - name: Lưu vết tích tiến hóa phân tán
        run: |
          git config --global user.name "Swarm-Node-Bot"
          git config --global user.email "bot@swarm.node"
          git add synapses/ synapse_backward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🐝 [Tiến Hóa Bầy Đàn] Cập nhật túi ký ức phân tán [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi
