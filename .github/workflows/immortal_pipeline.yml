name: Tự động chạy và Lưu ký ức Nơ-ron

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# CẤP QUYỀN GHI CHO MÁY CHỦ GITHUB
permissions:
  contents: write

jobs:
  chay-va-luu-ky-uc:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Chạy nơ-ron và xuất ký ức
        run: python xor_network.py

      - name: Tự động lưu tệp ký ức ngược lại kho GitHub
        run: |
          git config --global user.name "Neuron-Bot"
          git config --global user.email "bot@neuron.ai"
          git add brain_weights.json
          # [skip ci] để tránh việc bot lưu file lại kích hoạt chạy tiếp vô tận
          git commit -m "🧠 [AI Auto] Tự động cập nhật ký ức nơ-ron [skip ci]" || echo "Ký ức không có thay đổi"
          git push
